name: cookbook-clickhouse-metabase

services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.8.11.7
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-cookbook}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-local-clickhouse-only}
      CLICKHOUSE_DB: warehouse
    ports:
      - target: 8123
        published: "${CLICKHOUSE_HTTP_PORT:-38123}"
        host_ip: 127.0.0.1
    volumes: [clickhouse-data:/var/lib/clickhouse]
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    healthcheck:
      test: [CMD-SHELL, 'clickhouse-client --user "$$CLICKHOUSE_USER" --password "$$CLICKHOUSE_PASSWORD" --query "SELECT 1"']
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 2g

  metabase-db:
    image: postgres:16.15-alpine3.24
    environment:
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: ${METABASE_DB_PASSWORD:-local-metabase-db-only}
      POSTGRES_DB: metabase
    volumes: [metabase-db-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 512m

  metabase:
    image: metabase/metabase:v0.58.35
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: metabase-db
      MB_DB_PORT: 5432
      MB_DB_DBNAME: metabase
      MB_DB_USER: metabase
      MB_DB_PASS: ${METABASE_DB_PASSWORD:-local-metabase-db-only}
      MB_ANON_TRACKING_ENABLED: "false"
      MB_CHECK_FOR_UPDATES: "false"
      JAVA_TIMEZONE: UTC
      JAVA_OPTS: -Xms256m -Xmx1g
    ports:
      - target: 3000
        published: "${METABASE_PORT:-33000}"
        host_ip: 127.0.0.1
    depends_on:
      clickhouse: {condition: service_healthy}
      metabase-db: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, "5", http://127.0.0.1:3000/api/health]
      interval: 10s
      timeout: 10s
      retries: 45
      start_period: 60s
    mem_limit: 2g

volumes:
  clickhouse-data:
  metabase-db-data:
