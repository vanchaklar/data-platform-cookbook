name: cookbook-postgres-clickhouse-native
services:
  postgres:
    image: postgres:16.15-alpine3.24
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-postgres-only}
      POSTGRES_DB: postgres
    command: [postgres, -c, wal_level=logical, -c, max_replication_slots=4, -c, max_wal_senders=4, -c, max_slot_wal_keep_size=1GB, -c, timezone=UTC]
    ports: ["127.0.0.1:${POSTGRES_PORT:-15432}:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d postgres']
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 512m
  clickhouse:
    image: clickhouse/clickhouse-server:26.8.11.7
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-lab}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-local-clickhouse-only}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports: ["127.0.0.1:${CLICKHOUSE_HTTP_PORT:-18123}:8123"]
    volumes: [clickhouse-data:/var/lib/clickhouse]
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    healthcheck:
      test: [CMD-SHELL, 'clickhouse-client --user "$$CLICKHOUSE_USER" --password "$$CLICKHOUSE_PASSWORD" --query "SELECT 1"']
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 2g
  tests:
    profiles: [test]
    build: .
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: postgres
      PGUSER: ${POSTGRES_USER:-lab}
      PGPASSWORD: ${POSTGRES_PASSWORD:-local-postgres-only}
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-lab}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-local-clickhouse-only}
      ID_RANGE_SIZE: ${ID_RANGE_SIZE:-1000000}
      RUN_INTEGRATION: 1
    depends_on:
      postgres: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 256m
volumes:
  postgres-data:
  clickhouse-data:
